<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#122b3f">
  <meta name="description" content="TOOLIX Libya — hardware, power tools, workshop equipment, safety products and garden machinery delivered across Tripoli, Libya.">
  <title>TOOLIX Libya | أدوات ومعدات في طرابلس</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --navy: #122b3f;
      --navy-2: #0b2030;
      --red: #e30613;
      --red-dark: #bd0712;
      --yellow: #ffd600;
      --green: #22a85a;
      --cyan: #1baab8;
      --orange: #f18429;
      --muted: #6d7780;
      --line: #d9dee2;
      --surface: #fff;
      --bg: #f4f5f6;
      --shadow: 0 5px 18px rgba(15, 35, 50, .12);
      --radius: 7px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 154px;
    }

    body {
      margin: 0;
      color: #1d2730;
      background: var(--bg);
      font-family: "Cairo", "Inter", Arial, sans-serif;
      font-size: 14px;
      overflow-x: hidden;
    }

    html[dir="ltr"] body,
    html[dir="ltr"] button,
    html[dir="ltr"] input,
    html[dir="ltr"] select,
    html[dir="ltr"] textarea {
      font-family: "Inter", "Cairo", Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(var(--container), calc(100% - 28px));
      margin-inline: auto;
    }

    .top-offer {
      min-height: 39px;
      background: linear-gradient(90deg, #c6000d, #ed0011 55%, #bd000a);
      color: white;
      font-weight: 800;
    }

    .top-offer .container {
      min-height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .top-offer strong {
      color: var(--yellow);
      font-size: 16px;
    }

    .offer-countdown {
      display: inline-flex;
      gap: 4px;
      direction: ltr;
    }

    .offer-countdown b {
      min-width: 25px;
      padding: 2px 5px;
      border-radius: 3px;
      color: #151515;
      background: #fff;
      font-size: 12px;
    }

    .utility-bar {
      min-height: 33px;
      color: #d7e0e6;
      background: var(--navy-2);
      font-size: 11px;
    }

    .utility-inner {
      min-height: 33px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .utility-links,
    .utility-contact {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .utility-bar a,
    .utility-bar button {
      color: #d7e0e6;
      background: transparent;
      padding: 0;
    }

    .utility-bar a:hover,
    .utility-bar button:hover {
      color: white;
    }

    .utility-bar i {
      color: #ff5963;
      margin-inline-end: 5px;
    }

    .header-stack {
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 13px rgba(0, 0, 0, .14);
    }

    .main-header {
      background: #fff;
    }

    .header-inner {
      min-height: 79px;
      display: grid;
      grid-template-columns: 205px minmax(320px, 1fr) auto;
      align-items: center;
      gap: 24px;
    }

    .logo {
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: white;
      background: linear-gradient(135deg, var(--red), #b9000b);
      padding: 7px 13px;
      transform: skew(-6deg);
      box-shadow: 4px 4px 0 #172d3f;
      border-radius: 2px;
    }

    .logo > * {
      transform: skew(6deg);
    }

    .logo-mark {
      font-size: 27px;
      line-height: 1;
    }

    .logo-main {
      display: block;
      font-family: "Inter", sans-serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -1.3px;
      line-height: 1;
    }

    .logo-sub {
      display: block;
      margin-top: 3px;
      font-size: 9px;
      font-weight: 700;
      opacity: .88;
      letter-spacing: .2px;
    }

    .search-wrap {
      position: relative;
    }

    .search-form {
      height: 45px;
      display: grid;
      grid-template-columns: 135px 1fr 52px;
      border: 2px solid var(--navy);
      border-radius: 5px;
      overflow: hidden;
      background: white;
    }

    .search-form select {
      width: 100%;
      padding-inline: 9px;
      color: #273641;
      border: 0;
      border-inline-end: 1px solid #d6dce0;
      background: #f4f6f7;
      outline: 0;
      font-size: 11px;
    }

    .search-form input {
      min-width: 0;
      padding-inline: 16px;
      border: 0;
      outline: 0;
      color: #18242d;
      background: white;
    }

    .search-form button {
      color: white;
      background: var(--red);
      font-size: 17px;
      transition: background .2s, transform .2s;
    }

    .search-form button:hover {
      background: var(--red-dark);
    }

    .search-form button:active {
      transform: scale(.94);
    }

    .search-suggestions {
      position: absolute;
      z-index: 1010;
      top: calc(100% + 5px);
      inset-inline: 0;
      display: none;
      overflow: hidden;
      color: #26333c;
      background: white;
      border: 1px solid #dbe0e3;
      border-radius: 5px;
      box-shadow: var(--shadow);
    }

    .search-suggestions.active {
      display: block;
    }

    .suggestion-item {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      text-align: start;
      color: inherit;
      background: white;
      border-bottom: 1px solid #edf0f2;
    }

    .suggestion-item:last-child {
      border-bottom: 0;
    }

    .suggestion-item:hover {
      background: #f7f9fa;
    }

    .suggestion-item img {
      width: 44px;
      height: 36px;
      object-fit: cover;
      border-radius: 3px;
    }

    .suggestion-item span {
      font-size: 12px;
      font-weight: 700;
    }

    .suggestion-item b {
      color: var(--red);
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      align-items: stretch;
      gap: 7px;
    }

    .head-action {
      position: relative;
      min-width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      color: #263845;
      background: transparent;
      border-radius: 4px;
      transition: color .2s, background .2s;
    }

    .head-action:hover {
      color: var(--red);
      background: #f5f6f7;
    }

    .head-action i {
      font-size: 20px;
    }

    .head-action span:not(.action-count) {
      white-space: nowrap;
      font-size: 9px;
      font-weight: 700;
    }

    .action-count {
      position: absolute;
      top: 0;
      inset-inline-end: 9px;
      min-width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      color: white;
      background: var(--red);
      border: 2px solid white;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
    }

    .mobile-menu-btn {
      display: none;
      width: 42px;
      height: 42px;
      place-items: center;
      color: white;
      background: var(--navy);
      border-radius: 4px;
      font-size: 19px;
    }

    .category-nav {
      color: white;
      background: var(--navy);
    }

    .nav-inner {
      position: relative;
      min-height: 43px;
      display: flex;
      align-items: stretch;
    }

    .all-categories {
      min-width: 205px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: white;
      background: var(--red);
      font-size: 12px;
      font-weight: 800;
    }

    .all-categories:hover,
    .all-categories.active {
      background: var(--red-dark);
    }

    .main-nav {
      flex: 1;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    .main-nav a {
      flex: 1;
      min-width: max-content;
      display: grid;
      place-items: center;
      padding: 0 12px;
      color: #fff;
      border-inline-end: 1px solid rgba(255, 255, 255, .1);
      font-size: 11px;
      font-weight: 700;
      transition: background .2s;
    }

    .main-nav a:hover,
    .main-nav a.active {
      background: #213f56;
    }

    .nav-sale {
      color: #161616 !important;
      background: var(--yellow);
    }

    .nav-sale:hover {
      background: #f0c900 !important;
    }

    .mega-menu {
      position: absolute;
      z-index: 1005;
      top: 43px;
      inset-inline-start: 0;
      width: min(820px, 92vw);
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      padding: 16px;
      color: #22313b;
      background: white;
      border-top: 3px solid var(--red);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
    }

    .mega-menu.active {
      display: grid;
    }

    .mega-group {
      padding: 7px 16px;
      border-inline-end: 1px solid #e3e7e9;
    }

    .mega-group:last-child {
      border: 0;
    }

    .mega-group h4 {
      margin: 0 0 8px;
      color: var(--red);
      font-size: 12px;
    }

    .mega-group button {
      width: 100%;
      display: block;
      padding: 5px 0;
      text-align: start;
      color: #51606a;
      background: transparent;
      font-size: 11px;
    }

    .mega-group button:hover {
      color: var(--red);
      transform: translateX(-2px);
    }

    html[dir="ltr"] .mega-group button:hover {
      transform: translateX(2px);
    }

    .mobile-drawer {
      position: fixed;
      z-index: 1300;
      top: 0;
      bottom: 0;
      inset-inline-start: 0;
      width: min(340px, 88vw);
      overflow-y: auto;
      color: #25333d;
      background: white;
      box-shadow: 0 0 35px rgba(0, 0, 0, .25);
      transform: translateX(110%);
      transition: transform .3s ease;
    }

    html[dir="ltr"] .mobile-drawer {
      transform: translateX(-110%);
    }

    .mobile-drawer.open {
      transform: translateX(0);
    }

    .mobile-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 17px;
      color: white;
      background: var(--navy);
    }

    .mobile-head strong {
      font-size: 19px;
    }

    .mobile-head button {
      width: 38px;
      height: 38px;
      color: white;
      background: rgba(255, 255, 255, .1);
      border-radius: 50%;
    }

    .mobile-links {
      padding: 8px 0;
    }

    .mobile-links a,
    .mobile-links button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      text-align: start;
      color: #283842;
      background: white;
      border-bottom: 1px solid #edf0f2;
      font-size: 13px;
      font-weight: 700;
    }

    .mobile-links i {
      width: 22px;
      color: var(--red);
      text-align: center;
    }

    .drawer-overlay {
      position: fixed;
      z-index: 1200;
      inset: 0;
      display: none;
      background: rgba(5, 16, 25, .58);
      backdrop-filter: blur(2px);
    }

    .drawer-overlay.active {
      display: block;
    }

    main {
      min-height: 1000px;
    }

    .hero-area {
      padding-top: 13px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(280px, .9fr);
      gap: 10px;
    }

    .hero-slider {
      position: relative;
      min-height: 440px;
      overflow: hidden;
      background: #182d3c;
      border-radius: 3px;
      box-shadow: var(--shadow);
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: clamp(28px, 5vw, 65px);
      color: white;
      background-position: center;
      background-size: cover;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.02);
      transition: opacity .55s, transform .7s, visibility .55s;
    }

    .hero-slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 16, 24, .91) 0%, rgba(7, 22, 33, .74) 48%, rgba(7, 15, 22, .14) 100%);
    }

    html[dir="rtl"] .hero-slide::before {
      background: linear-gradient(270deg, rgba(5, 16, 24, .91) 0%, rgba(7, 22, 33, .74) 48%, rgba(7, 15, 22, .14) 100%);
    }

    .hero-slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(535px, 77%);
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      padding: 5px 10px;
      color: #1c1c1c;
      background: var(--yellow);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 900;
    }

    .hero-content h1 {
      margin: 0;
      font-size: clamp(29px, 4vw, 54px);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -.6px;
    }

    .hero-content p {
      max-width: 470px;
      margin: 13px 0 21px;
      color: #e6edf1;
      font-size: 15px;
      line-height: 1.8;
    }

    .hero-price {
      margin-bottom: 17px;
      color: var(--yellow);
      font-size: 31px;
      font-weight: 900;
    }

    .hero-price small {
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .primary-btn,
    .dark-btn,
    .outline-btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 19px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 800;
      transition: transform .2s, background .2s, color .2s;
    }

    .primary-btn {
      color: white;
      background: var(--red);
    }

    .primary-btn:hover {
      background: var(--red-dark);
      transform: translateY(-2px);
    }

    .dark-btn {
      color: white;
      background: var(--navy);
    }

    .dark-btn:hover {
      background: #1c425e;
      transform: translateY(-2px);
    }

    .outline-btn {
      color: white;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .65);
    }

    .outline-btn:hover {
      color: #151515;
      background: white;
    }

    .hero-controls {
      position: absolute;
      z-index: 5;
      bottom: 16px;
      inset-inline: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .hero-arrows {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .hero-arrow {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(9, 27, 40, .74);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 2px;
    }

    .hero-arrow:hover {
      background: var(--red);
    }

    .hero-dots {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .hero-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      background: rgba(255, 255, 255, .55);
      border-radius: 50%;
    }

    .hero-dot.active {
      width: 25px;
      background: var(--red);
      border-radius: 10px;
    }

    .hero-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
    }

    .side-offer {
      position: relative;
      min-height: 215px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      padding: 22px;
      color: white;
      background-position: center;
      background-size: cover;
      border-radius: 3px;
      box-shadow: var(--shadow);
    }

    .side-offer::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(3, 14, 21, .95), rgba(7, 17, 25, .05) 72%);
    }

    .side-offer-content {
      position: relative;
      z-index: 2;
    }

    .side-offer small {
      display: inline-block;
      margin-bottom: 3px;
      color: var(--yellow);
      font-weight: 800;
    }

    .side-offer h2 {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.2;
    }

    .side-offer strong {
      color: var(--yellow);
      font-size: 21px;
    }

    .side-offer button {
      margin-inline-start: 8px;
      padding: 6px 9px;
      color: white;
      background: var(--red);
      border-radius: 2px;
      font-size: 10px;
      font-weight: 800;
    }

    .benefits {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      color: white;
      background: var(--navy);
      border-radius: 3px;
    }

    .benefit {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 10px 17px;
      border-inline-end: 1px solid rgba(255, 255, 255, .13);
    }

    .benefit:last-child {
      border: 0;
    }

    .benefit i {
      color: var(--yellow);
      font-size: 25px;
    }

    .benefit strong,
    .benefit small {
      display: block;
    }

    .benefit strong {
      font-size: 12px;
    }

    .benefit small {
      margin-top: 2px;
      color: #cbd7de;
      font-size: 9px;
    }

    .section-block {
      margin-top: 18px;
      padding: 17px 0 0;
      background: white;
      border: 1px solid #e0e4e6;
      box-shadow: 0 2px 8px rgba(30, 45, 55, .04);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 17px;
      margin: 0 18px 14px;
    }

    .section-heading::before,
    .section-heading::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #7e868c;
    }

    .section-heading-content {
      flex: 0 0 auto;
      text-align: center;
    }

    .section-heading h2 {
      margin: 0;
      color: #27333d;
      font-size: 18px;
      font-weight: 900;
    }

    .section-heading p {
      margin: 2px 0 0;
      color: #899198;
      font-size: 9px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      padding: 0 14px 17px;
    }

    .category-card {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 5px;
      color: #284052;
      background: #f7f8f9;
      border: 1px solid #e3e7e9;
      border-radius: 4px;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: var(--red);
      box-shadow: 0 7px 16px rgba(28, 44, 54, .11);
    }

    .category-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, var(--navy), #315c78);
      border-radius: 50%;
      font-size: 27px;
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, .08);
    }

    .category-card:nth-child(2n) .category-icon {
      background: linear-gradient(145deg, var(--red), #a9000b);
    }

    .category-card span {
      font-size: 10px;
      font-weight: 800;
      text-align: center;
    }

    .sale-banner {
      position: relative;
      min-height: 185px;
      display: flex;
      align-items: center;
      margin-top: 18px;
      overflow: hidden;
      padding: 28px 42px;
      color: white;
      background-position: center;
      background-size: cover;
      box-shadow: var(--shadow);
    }

    .sale-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 25, 36, .97), rgba(9, 25, 36, .79) 49%, rgba(9, 25, 36, .16));
    }

    html[dir="rtl"] .sale-banner::before {
      background: linear-gradient(270deg, rgba(9, 25, 36, .97), rgba(9, 25, 36, .79) 49%, rgba(9, 25, 36, .16));
    }

    .sale-banner.red::before {
      background: linear-gradient(90deg, rgba(181, 0, 12, .97), rgba(198, 0, 13, .78) 50%, rgba(12, 15, 18, .18));
    }

    html[dir="rtl"] .sale-banner.red::before {

    .modal-layer {

      z-index: 1600;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(6, 18, 27, .71);
      backdrop-filter: blur(3px);
    }

    .modal-layer.active {
      display: flex;
    }

    .modal {
      width: min(920px, 96vw);
      max-height: 91vh;
      overflow: hidden;
      color: #273640;
      background: white;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
      animation: modalIn .22s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }

    .modal-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 19px;
      color: white;
      background: var(--navy);

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .modal-head button {
      width: 36px;
      height: 36px;
      color: white;
      background: rgba(255, 255, 255, .1);
      border-radius: 50%;
    }

    .modal-body {
      max-height: calc(91vh - 58px);
      overflow-y: auto;
      padding: 20px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 1.15fr;
      gap: 25px;
    }

    .quick-image {
      height: 365px;
      overflow: hidden;
      background: #f2f4f5;
    }

    .quick-image img {

      height: 100%;

    }

    .quick-details .product-brand {
      color: var(--red);
      font-size: 14px;
    }

    .quick-details h3 {
      margin: 7px 0 10px;
      font-size: 24px;
      line-height: 1.35;
    }

    .quick-details .current-price {
      display: block;
      margin: 16px 0 7px;
      font-size: 34px;
    }

    .quick-details p {
      color: #6c787f;
      line-height: 1.8;
    }

    .feature-list {
      margin: 14px 0;
      padding: 0;
      list-style: none;
    }

    .feature-list li {
      margin: 7px 0;
      color: #4d5e68;
      font-size: 12px;
    }

    .feature-list i {
      color: var(--green);
      margin-inline-end: 7px;
    }

    .search-results-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    .search-result-card {
      overflow: hidden;
      border: 1px solid #dce1e4;
      background: white;
    }

    .search-result-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .search-result-info {
      padding: 10px;
    }

    .search-result-info h4 {
      min-height: 37px;
      margin: 0 0 7px;
      font-size: 10px;
    }

    .search-result-info strong {
      color: var(--red);
    }

    .search-result-info button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      color: white;
      background: var(--navy);
      font-size: 9px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-size: 10px;
      font-weight: 800;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid #cfd6da;
      border-radius: 3px;
      outline: 0;
    }

    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(227, 6, 19, .08);
    }

    .modal-submit {
      min-height: 44px;
      padding: 0 24px;
      color: white;
      background: var(--red);
      border-radius: 3px;
      font-weight: 900;
    }

    .order-summary {
      margin-bottom: 18px;
      padding: 13px;
      background: #f2f4f5;
      border: 1px solid #dce1e4;
    }

    .order-summary-line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 11px;
    }

    .order-summary-line.total {
      margin-top: 5px;
      padding-top: 10px;
      border-top: 1px solid #cfd6da;
      color: var(--red);
      font-size: 15px;
      font-weight: 900;
    }

    .success-box {
      padding: 35px;
      text-align: center;
    }

    .success-box i {
      margin-bottom: 15px;
      color: var(--green);
      font-size: 67px;
    }

    .success-box h3 {
      margin: 0 0 7px;
      font-size: 24px;
    }

    .toast-stack {
      position: fixed;
      z-index: 1800;
      bottom: 22px;
      inset-inline-start: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      min-width: 270px;
      max-width: min(390px, calc(100vw - 30px));
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 15px;
      color: white;
      background: #17374c;
      border-inline-start: 4px solid var(--green);
      box-shadow: 0 9px 25px rgba(0, 0, 0, .22);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      animation: toastIn .25s ease;
    }

    .toast.error {
      border-color: var(--red);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .floating-actions {
      position: fixed;
      z-index: 900;
      bottom: 20px;
      inset-inline-end: 19px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .float-btn {
      width: 49px;
      height: 49px;
      display: grid;
      place-items: center;
      color: white;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 7px 18px rgba(0, 0, 0, .22);
      font-size: 23px;
      transition: transform .2s;
    }

    .float-btn:hover {
      transform: translateY(-3px);
    }

    .back-top {
      display: none;
      background: var(--navy);
      font-size: 16px;
    }

    .back-top.show {
      display: grid;
    }

    .no-results {
      grid-column: 1 / -1;
      padding: 45px 20px;
      color: #7d898f;
      text-align: center;
    }

    .no-results i {
      display: block;
      margin-bottom: 12px;
      font-size: 48px;
      color: #c9d0d4;
    }

    @media (max-width: 1050px) {
      .header-inner {
        grid-template-columns: 175px minmax(300px, 1fr) auto;
        gap: 14px;
      }

      .logo-main {
        font-size: 21px;
      }

      .head-action {
        min-width: 54px;
      }

      .head-action span:not(.action-count) {
        display: none;
      }

      .category-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-card {
        flex-basis: calc((100% - 24px) / 4);
      }

      .brand-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 860px) {
      html {
        scroll-padding-top: 126px;
      }

      .utility-bar {
        display: none;
      }

      .header-inner {
        min-height: 125px;
        grid-template-columns: 48px 1fr auto;
        grid-template-rows: 63px 51px;
        gap: 4px 10px;
        padding-top: 3px;
      }

      .mobile-menu-btn {
        display: grid;
      }

      .logo {
        width: 170px;
        min-height: 43px;
      }

      .logo-main {
        font-size: 20px;
      }

      .search-wrap {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .header-actions {
        justify-content: end;
      }

      .head-action {
        min-width: 43px;
        padding: 4px;
      }

      .head-action i {
        font-size: 18px;
      }

      .action-count {
        inset-inline-end: 2px;
      }

      .category-nav {
        display: none;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero-slider {
        min-height: 400px;
      }

      .hero-side {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: none;
      }

      .side-offer {
        min-height: 190px;
      }

      .benefits {
        grid-template-columns: 1fr 1fr;
      }

      .benefit:nth-child(2) {
        border-inline-end: 0;
      }

      .benefit:nth-child(-n+2) {
        border-bottom: 1px solid rgba(255, 255, 255, .13);
      }

      .product-card {
        flex-basis: calc((100% - 16px) / 3);
      }

      .directory-grid {
        grid-template-columns: 1fr 1fr;
      }

      .store-grid {
        grid-template-columns: 1fr 1fr;
      }

      .service-banner {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-benefits {
        grid-template-columns: repeat(3, 1fr);
      }

      .footer-benefit:nth-child(3) {
        border: 0;
      }

      .footer-benefit:nth-child(n+4) {
        border-top: 1px solid #d6dade;
      }

      .search-results-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 620px) {
      .container {
        width: min(100% - 14px, var(--container));
      }

      .top-offer .container {
        gap: 7px;
        font-size: 10px;
      }

      .top-offer strong {
        font-size: 12px;
      }

      .offer-countdown {
        display: none;
      }

      .header-inner {
        grid-template-columns: 44px 1fr auto;
      }

      .logo {
        width: 145px;
        min-height: 40px;
        gap: 7px;
        padding: 6px 9px;
      }

      .logo-mark {
        font-size: 20px;
      }

      .logo-main {
        font-size: 17px;
      }

      .logo-sub {
        font-size: 7px;
      }

      .header-actions {
        gap: 0;
      }

      .head-action {
        min-width: 37px;
      }

      .head-action:nth-child(2) {
        display: none;
      }

      .search-form {
        grid-template-columns: 1fr 46px;
      }

      .search-form select {
        display: none;
      }

      .hero-slider {
        min-height: 390px;
      }

      .hero-slide {
        align-items: flex-start;
        padding: 37px 23px 70px;
        background-position: 63% center;
      }

      .hero-slide::before,
      html[dir="rtl"] .hero-slide::before {
        background: linear-gradient(0deg, rgba(5, 16, 24, .94), rgba(5, 16, 24, .62) 80%, rgba(5, 16, 24, .35));
      }

      .hero-content {
        width: 100%;
      }

      .hero-content h1 {
        font-size: 31px;
      }

      .hero-content p {
        font-size: 12px;
        line-height: 1.65;
      }

      .hero-side {
        grid-template-columns: 1fr;
      }

      .side-offer {
        min-height: 180px;
      }

      .benefits {
        grid-template-columns: 1fr 1fr;
      }

      .benefit {
        min-height: 83px;
        padding: 9px;
        gap: 8px;
      }

      .benefit i {
        font-size: 21px;
      }

      .benefit strong {
        font-size: 10px;
      }

      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .category-card {
        min-height: 120px;
      }

      .section-heading {
        gap: 8px;
        margin-inline: 10px;
      }

      .section-heading h2 {
        font-size: 15px;
      }

      .product-card {
        flex-basis: 75%;
        min-width: 225px;
      }

      .promo-grid {
        grid-template-columns: 1fr;
      }

      .promo-card {
        min-height: 210px;
      }

      .sale-banner {
        min-height: 245px;
        align-items: flex-end;
        padding: 25px 20px;
        background-position: 60% center;
      }

      .sale-banner::before,
      .sale-banner.red::before,
      .sale-banner.green::before,
      html[dir="rtl"] .sale-banner::before,
      html[dir="rtl"] .sale-banner.red::before,
      html[dir="rtl"] .sale-banner.green::before {
        background: linear-gradient(0deg, rgba(7, 23, 34, .96), rgba(7, 23, 34, .32));
      }

      .sale-banner.red::before,
      html[dir="rtl"] .sale-banner.red::before {
        background: linear-gradient(0deg, rgba(174, 0, 12, .96), rgba(174, 0, 12, .26));
      }

      .sale-banner.green::before,
      html[dir="rtl"] .sale-banner.green::before {
        background: linear-gradient(0deg, rgba(15, 78, 46, .96), rgba(15, 78, 46, .25));
      }

      .mini-category-row {
        grid-template-columns: repeat(3, 1fr);
      }

      .brand-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .service-main,
      .service-contact {
        padding: 22px 18px;
      }

      .service-main h2,
      .service-contact h2 {
        font-size: 22px;
      }

      .service-contact {
        align-items: flex-start;
        flex-direction: column;
      }

      .directory-grid {
        grid-template-columns: 1fr;
      }

      .store-grid {
        grid-template-columns: 1fr;
      }

      .store-card {
        min-height: 180px;
      }

      .about-box {
        padding: 21px 15px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
        gap: 19px;
      }

      .footer-benefits {
        grid-template-columns: 1fr 1fr;
      }

      .footer-benefit:nth-child(3) {
        border-top: 1px solid #d6dade;
        border-inline-end: 1px solid #d6dade;
      }

      .footer-benefit:nth-child(2n) {
        border-inline-end: 0;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .quick-image {
        height: 250px;
      }

      .search-results-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: auto;
      }

      .carousel-btn {
        width: 32px;
      }
    }
  </style>
</head>

  <div class="top-offer">

    function formatMoney(value) {
      const locale = language === "ar" ? "ar-LY" : "en-US";
      const number = new Intl.NumberFormat(locale, {maximumFractionDigits: 0}).format(value);
      return language === "ar" ? `${number} د.ل` : `${number} LYD`;
    }

    function saveState() {
      localStorage.setItem("toolix-cart", JSON.stringify(cart));
      localStorage.setItem("toolix-wishlist", JSON.stringify(wishlist));
      localStorage.setItem("toolix-compare", JSON.stringify(compare));

    function productCard(product) {
      const isFav = wishlist.includes(product.id);
      const isCompared = compare.includes(product.id);

      return `

          <div class="product-image">
            <img loading="lazy" src="${product.image}" alt="${product.en}">

          </div>

              <span class="old-price money" data-price="${product.old}"></span>
            </div>
            <div class="card-bottom">
              <button class="add-to-cart" type="button" data-add="${product.id}">
                <i class="fa-solid fa-cart-plus"></i><span data-ar="أضف للسلة" data-en="ADD TO CART"></span>
              </button>
              <button class="compare-btn ${isCompared ? "active" : ""}" type="button" data-compare="${product.id}" aria-label="Compare">
                <i class="fa-solid fa-code-compare"></i>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderProducts() {
      Object.entries(trackMap).forEach(([trackId, section]) => {
        const track = document.getElementById(trackId);
        track.innerHTML = products.filter(product => product.section === section).map(productCard).join("");
      });
      applyLanguage();
    }

    function applyLanguage() {
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      document.title = language === "ar"
        ? "TOOLIX ليبيا | أدوات ومعدات في طرابلس"
        : "TOOLIX Libya | Tools & Equipment in Tripoli";

      document.querySelectorAll("[data-ar][data-en]").forEach(element => {
        element.textContent = element.dataset[language];
      });

      document.querySelectorAll("[data-ph-ar][data-ph-en]").forEach(element => {
        element.placeholder = language === "ar" ? element.dataset.phAr : element.dataset.phEn;
      });

      document.querySelectorAll(".money").forEach(element => {
        element.textContent = formatMoney(Number(element.dataset.price));
      });

      document.getElementById("languageLabel").textContent = language === "ar" ? "English" : "العربية";
      localStorage.setItem("toolix-language", language);
      renderCart();
      updateCounts();
    }

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      applyLanguage();
      closeMobileDrawer();
      showToast(language === "ar" ? "تم تغيير اللغة إلى العربية" : "Language changed to English");
    }

    function updateCounts() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCount").textContent = count;
      document.getElementById("wishlistCount").textContent = wishlist.length;
    }

    function addToCart(id, quantity = 1) {
      const product = products.find(item => item.id === Number(id));
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);
      if (existing) existing.qty += quantity;
      else cart.push({id: product.id, qty: quantity});

      saveState();
      updateCounts();
      renderCart();
      showToast(language === "ar" ? "تمت إضافة المنتج إلى السلة" : "Product added to cart");
    }

    function renderCart() {
      const cartItems = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");

      if (!cart.length) {
        cartItems.innerHTML = `
          <div class="empty-cart">
            <div>
              <i class="fa-solid fa-cart-shopping"></i>
              <strong>${language === "ar" ? "سلة التسوق فارغة" : "Your cart is empty"}</strong>
              <p>${language === "ar" ? "أضف بعض الأدوات للبدء." : "Add some tools to get started."}</p>
            </div>
          </div>`;
        cartTotal.textContent = formatMoney(0);
        return;
      }

      cartItems.innerHTML = cart.map(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return "";
        return `
          <div class="cart-item">
            <img src="${product.image}" alt="${product.en}">
            <div>
              <h4>${language === "ar" ? product.ar : product.en}</h4>
              <strong>${formatMoney(product.price)}</strong>
              <div class="qty-control">
                <button type="button" data-qty="${product.id}" data-change="-1">−</button>
                <span>${item.qty}</span>
                <button type="button" data-qty="${product.id}" data-change="1">+</button>
              </div>
            </div>
            <button class="remove-item" type="button" data-remove="${product.id}" aria-label="Remove"><i class="fa-solid fa-trash"></i></button>
          </div>`;
      }).join("");

      const total = cart.reduce((sum, item) => {
        const product = products.find(p => p.id === item.id);
        return sum + (product ? product.price * item.qty : 0);
      }, 0);

      cartTotal.textContent = formatMoney(total);
    }

    function openCart() {
      document.getElementById("cartDrawer").classList.add("open");
      document.getElementById("drawerOverlay").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeCart() {
      document.getElementById("cartDrawer").classList.remove("open");
      if (!document.getElementById("mobileDrawer").classList.contains("open")) {
        document.getElementById("drawerOverlay").classList.remove("active");
        document.body.style.overflow = "";
      }
    }

    function openMobileDrawer() {
      document.getElementById("mobileDrawer").classList.add("open");
      document.getElementById("drawerOverlay").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeMobileDrawer() {
      document.getElementById("mobileDrawer").classList.remove("open");
      if (!document.getElementById("cartDrawer").classList.contains("open")) {
        document.getElementById("drawerOverlay").classList.remove("active");
        document.body.style.overflow = "";
      }
    }

    function openModal(title, content) {
      document.getElementById("modalTitle").textContent = title;

      document.getElementById("modalLayer").classList.add("active");

      document.getElementById("modalLayer").classList.remove("active");

    function showQuickView(id) {

              <li><i class="fa-solid fa-circle-check"></i>${language === "ar" ? "منتج أصلي بضمان" : "Genuine product with warranty"}</li>

            </ul>
            <button class="primary-btn" type="button" data-add="${product.id}">
              <i class="fa-solid fa-cart-plus"></i>${language === "ar" ? "أضف إلى السلة" : "Add To Cart"}
            </button>
          </div>
        </div>`;

      openModal(language === "ar" ? "تفاصيل المنتج" : "Product Details", content);
    }

    function getSearchMatches(query, section = "") {
      const normalized = query.trim().toLowerCase();
      return products.filter(product => {
        const sectionMatch = !section || product.section === section;
        const text = `${product.ar} ${product.en} ${product.brand} ${product.section}`.toLowerCase();
        return sectionMatch && (!normalized || text.includes(normalized));
      });
    }

    function showSearchResults(query, section = "") {
      const matches = getSearchMatches(query, section);
      const title = language === "ar" ? "نتائج البحث" : "Search Results";
      const content = matches.length
        ? `<div class="search-results-grid">${matches.map(product => `
            <article class="search-result-card">
              <img src="${product.image}" alt="${product.en}">
              <div class="search-result-info">
                <h4>${language === "ar" ? product.ar : product.en}</h4>
                <strong>${formatMoney(product.price)}</strong>
                <button type="button" data-quick="${product.id}">${language === "ar" ? "عرض التفاصيل" : "VIEW DETAILS"}</button>
              </div>
            </article>`).join("")}</div>`
        : `<div class="no-results"><i class="fa-solid fa-magnifying-glass"></i><strong>${language === "ar" ? "لم نعثر على منتجات مطابقة" : "No matching products found"}</strong></div>`;

      openModal(title, content);
      document.getElementById("searchSuggestions").classList.remove("active");
      closeMobileDrawer();
      document.getElementById("megaMenu").classList.remove("active");
    }

    function toggleWishlist(id) {
      id = Number(id);
      const index = wishlist.indexOf(id);
      if (index >= 0) wishlist.splice(index, 1);
      else wishlist.push(id);
      saveState();
      renderProducts();
      showToast(index >= 0
        ? (language === "ar" ? "تمت إزالة المنتج من المفضلة" : "Removed from wishlist")
        : (language === "ar" ? "تمت إضافة المنتج إلى المفضلة" : "Added to wishlist"));
    }

    function toggleCompare(id) {
      id = Number(id);
      const index = compare.indexOf(id);

      if (index >= 0) {
        compare.splice(index, 1);
      } else {
        if (compare.length >= 4) {
          showToast(language === "ar" ? "يمكن مقارنة 4 منتجات كحد أقصى" : "You can compare up to 4 products", true);
          return;
        }
        compare.push(id);
      }

      saveState();
      renderProducts();
      showToast(language === "ar" ? "تم تحديث قائمة المقارنة" : "Comparison list updated");
    }

    function showWishlist() {
      const matches = products.filter(product => wishlist.includes(product.id));
      const content = matches.length
        ? `<div class="search-results-grid">${matches.map(product => `
            <article class="search-result-card">
              <img src="${product.image}" alt="${product.en}">
              <div class="search-result-info">
                <h4>${language === "ar" ? product.ar : product.en}</h4>
                <strong>${formatMoney(product.price)}</strong>
                <button type="button" data-add="${product.id}">${language === "ar" ? "أضف للسلة" : "ADD TO CART"}</button>
              </div>
            </article>`).join("")}</div>`
        : `<div class="no-results"><i class="fa-regular fa-heart"></i><strong>${language === "ar" ? "قائمة المفضلة فارغة" : "Your wishlist is empty"}</strong></div>`;

      openModal(language === "ar" ? "المنتجات المفضلة" : "My Wishlist", content);
    }

    function openLogin() {
      openModal(
        language === "ar" ? "تسجيل الدخول" : "Sign In",
        `<form id="loginForm" class="form-grid">
          <div class="form-field full">
            <label>${language === "ar" ? "البريد الإلكتروني أو رقم الهاتف" : "Email or phone number"}</label>
            <input name="identity" required placeholder="${language === "ar" ? "أدخل بياناتك" : "Enter your details"}">
          </div>
          <div class="form-field full">
            <label>${language === "ar" ? "كلمة المرور" : "Password"}</label>
            <input type="password" name="password" required minlength="4" placeholder="••••••••">
          </div>
          <div class="form-field full">
            <button class="modal-submit" type="submit">${language === "ar" ? "تسجيل الدخول" : "SIGN IN"}</button>
          </div>
        </form>`
      );

      document.getElementById("loginForm").addEventListener("submit", event => {
        event.preventDefault();
        closeModal();
        showToast(language === "ar" ? "تم تسجيل الدخول بنجاح" : "Signed in successfully");
      });
    }

    function openTrackOrder() {
      openModal(
        language === "ar" ? "تتبع طلبك" : "Track Your Order",
        `<form id="trackForm" class="form-grid">
          <div class="form-field full">
            <label>${language === "ar" ? "رقم الطلب" : "Order number"}</label>
            <input name="order" required placeholder="TLX-2025-0001">
          </div>
          <div class="form-field full">
            <label>${language === "ar" ? "رقم الهاتف" : "Phone number"}</label>
            <input name="phone" required inputmode="tel" placeholder="+218 9X XXX XXXX">
          </div>
          <div class="form-field full">
            <button class="modal-submit" type="submit">${language === "ar" ? "تتبع الطلب" : "TRACK ORDER"}</button>
          </div>
        </form>`
      );

      document.getElementById("trackForm").addEventListener("submit", event => {
        event.preventDefault();
        document.getElementById("modalBody").innerHTML = `
          <div class="success-box">
            <i class="fa-solid fa-box-open"></i>
            <h3>${language === "ar" ? "طلبك قيد التجهيز" : "Your order is being prepared"}</h3>
            <p>${language === "ar" ? "سيتم التواصل معك عند خروج الطلب للتوصيل." : "We will contact you when your order leaves for delivery."}</p>
          </div>`;
      });
    }

    function openQuoteForm() {
      openModal(
        language === "ar" ? "طلب عرض سعر للمشاريع" : "Request A Project Quote",
        `<form id="quoteForm" class="form-grid">
          <div class="form-field">
            <label>${language === "ar" ? "الاسم" : "Name"}</label>
            <input required name="name">
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "الشركة" : "Company"}</label>
            <input name="company">
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "رقم الهاتف" : "Phone number"}</label>
            <input required name="phone" inputmode="tel">
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "البريد الإلكتروني" : "Email"}</label>
            <input type="email" name="email">
          </div>
          <div class="form-field full">
            <label>${language === "ar" ? "تفاصيل المعدات والكميات" : "Equipment and quantity details"}</label>
            <textarea required name="details"></textarea>
          </div>
          <div class="form-field full">
            <button class="modal-submit" type="submit">${language === "ar" ? "إرسال الطلب" : "SEND REQUEST"}</button>
          </div>
        </form>`
      );

      document.getElementById("quoteForm").addEventListener("submit", event => {
        event.preventDefault();
        document.getElementById("modalBody").innerHTML = `
          <div class="success-box">
            <i class="fa-solid fa-circle-check"></i>
            <h3>${language === "ar" ? "تم استلام طلبك" : "Request Received"}</h3>
            <p>${language === "ar" ? "سيتواصل فريق المشاريع معك خلال يوم عمل." : "Our project team will contact you within one business day."}</p>
          </div>`;
      });
    }

    function openCheckout() {
      if (!cart.length) {
        showToast(language === "ar" ? "سلة التسوق فارغة" : "Your cart is empty", true);
        return;
      }

      const subtotal = cart.reduce((sum, item) => {
        const product = products.find(p => p.id === item.id);
        return sum + product.price * item.qty;
      }, 0);
      const delivery = subtotal >= 300 ? 0 : 20;

      openModal(
        language === "ar" ? "إتمام الطلب" : "Checkout",
        `<div class="order-summary">
          <div class="order-summary-line"><span>${language === "ar" ? "قيمة المنتجات" : "Products subtotal"}</span><strong>${formatMoney(subtotal)}</strong></div>
          <div class="order-summary-line"><span>${language === "ar" ? "التوصيل" : "Delivery"}</span><strong>${delivery ? formatMoney(delivery) : (language === "ar" ? "مجاني" : "FREE")}</strong></div>
          <div class="order-summary-line total"><span>${language === "ar" ? "الإجمالي" : "Total"}</span><strong>${formatMoney(subtotal + delivery)}</strong></div>
        </div>
        <form id="checkoutForm" class="form-grid">
          <div class="form-field">
            <label>${language === "ar" ? "الاسم الكامل" : "Full name"}</label>
            <input required name="name">
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "رقم الهاتف" : "Phone number"}</label>
            <input required name="phone" inputmode="tel" placeholder="+218">
          </div>
          <div class="form-field full">
            <label>${language === "ar" ? "العنوان داخل طرابلس" : "Delivery address in Tripoli"}</label>
            <input required name="address">
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "طريقة الدفع" : "Payment method"}</label>
            <select name="payment">
              <option>${language === "ar" ? "الدفع عند الاستلام" : "Cash on delivery"}</option>
              <option>${language === "ar" ? "الدفع بالبطاقة عند الاستلام" : "Card on delivery"}</option>
              <option>${language === "ar" ? "تحويل مصرفي" : "Bank transfer"}</option>
            </select>
          </div>
          <div class="form-field">
            <label>${language === "ar" ? "وقت التوصيل المفضل" : "Preferred delivery time"}</label>
            <select name="time">
              <option>${language === "ar" ? "أي وقت" : "Any time"}</option>
              <option>${language === "ar" ? "09:00 - 13:00" : "09:00 - 13:00"}</option>
              <option>${language === "ar" ? "14:00 - 19:00" : "14:00 - 19:00"}</option>
            </select>
          </div>
          <div class="form-field full">
            <button class="modal-submit" type="submit">${language === "ar" ? "تأكيد الطلب" : "CONFIRM ORDER"}</button>
          </div>
        </form>`
      );

      document.getElementById("checkoutForm").addEventListener("submit", event => {
        event.preventDefault();
        const orderNumber = `TLX-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
        cart = [];
        saveState();
        updateCounts();
        renderCart();
        closeCart();

        document.getElementById("modalTitle").textContent = language === "ar" ? "تم تأكيد الطلب" : "Order Confirmed";
        document.getElementById("modalBody").innerHTML = `
          <div class="success-box">
            <i class="fa-solid fa-circle-check"></i>
            <h3>${language === "ar" ? "شكراً لطلبك!" : "Thank you for your order!"}</h3>
            <p>${language === "ar" ? "رقم الطلب" : "Order number"}: <strong>${orderNumber}</strong></p>
            <p>${language === "ar" ? "سنتواصل معك لتأكيد العنوان وموعد التوصيل." : "We will contact you to confirm your address and delivery time."}</p>
          </div>`;
      });
    }

    function showToast(message, isError = false) {
      const toast = document.createElement("div");
      toast.className = `toast${isError ? " error" : ""}`;
      toast.innerHTML = `<i class="fa-solid ${isError ? "fa-circle-exclamation" : "fa-circle-check"}"></i><span>${message}</span>`;
      document.getElementById("toastStack").appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    function showSlide(index) {
      const slides = [...document.querySelectorAll(".hero-slide")];
      const dots = [...document.querySelectorAll(".hero-dot")];
      currentSlide = (index + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle("active", i === currentSlide));
      dots.forEach((dot, i) => dot.classList.toggle("active", i === currentSlide));
    }

    function restartSlider() {
      clearInterval(slideTimer);
      slideTimer = setInterval(() => showSlide(currentSlide + 1), 6500);
    }

    function updateCountdown() {
      const now = Date.now();
      const day = 24 * 60 * 60 * 1000;
      let end = Number(localStorage.getItem("toolix-offer-end"));
      if (!end || end < now) {
        end = now + day;
        localStorage.setItem("toolix-offer-end", end);
      }

      const remaining = Math.max(0, end - now);
      const hours = Math.floor(remaining / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      document.getElementById("offerCountdown").innerHTML = `
        <b>${String(hours).padStart(2, "0")}</b>:<b>${String(minutes).padStart(2, "0")}</b>:<b>${String(seconds).padStart(2, "0")}</b>`;
    }

    document.addEventListener("click", event => {
      const addButton = event.target.closest("[data-add]");
      if (addButton) {
        addToCart(addButton.dataset.add);
        return;
      }

      const quickButton = event.target.closest("[data-quick]");
      if (quickButton) {
        showQuickView(quickButton.dataset.quick);
        return;
      }

      const favButton = event.target.closest("[data-fav]");
      if (favButton) {
        toggleWishlist(favButton.dataset.fav);
        return;
      }

      const compareButton = event.target.closest("[data-compare]");
      if (compareButton) {
        toggleCompare(compareButton.dataset.compare);
        return;
      }

      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) {
        showSearchResults("", filterButton.dataset.filter);
        return;
      }

      const queryButton = event.target.closest("[data-query-ar], [data-query-en]");
      if (queryButton) {
        const query = language === "ar" ? queryButton.dataset.queryAr : queryButton.dataset.queryEn;
        showSearchResults(query || "");
        return;
      }

      const mapButton = event.target.closest("[data-map]");
      if (mapButton) {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapButton.dataset.map)}`, "_blank", "noopener");
        return;
      }

      const qtyButton = event.target.closest("[data-qty]");
      if (qtyButton) {
        const item = cart.find(cartItem => cartItem.id === Number(qtyButton.dataset.qty));
        if (item) {
          item.qty += Number(qtyButton.dataset.change);
          if (item.qty <= 0) cart = cart.filter(cartItem => cartItem.id !== item.id);
          saveState();
          renderCart();
          updateCounts();
        }
        return;
      }

      const removeButton = event.target.closest("[data-remove]");
      if (removeButton) {
        cart = cart.filter(item => item.id !== Number(removeButton.dataset.remove));
        saveState();
        renderCart();
        updateCounts();
      }
    });

    document.getElementById("languageBtn").addEventListener("click", () => setLanguage(language === "ar" ? "en" : "ar"));
    document.getElementById("mobileLanguageBtn").addEventListener("click", () => setLanguage(language === "ar" ? "en" : "ar"));

    document.getElementById("cartBtn").addEventListener("click", openCart);
    document.getElementById("closeCart").addEventListener("click", closeCart);
    document.getElementById("mobileMenuBtn").addEventListener("click", openMobileDrawer);
    document.getElementById("closeMobileMenu").addEventListener("click", closeMobileDrawer);

    document.getElementById("drawerOverlay").addEventListener("click", () => {
      closeCart();
      closeMobileDrawer();
    });

    document.getElementById("categoryMenuBtn").addEventListener("click", () => {
      document.getElementById("megaMenu").classList.toggle("active");
      document.getElementById("categoryMenuBtn").classList.toggle("active");
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".nav-inner")) {
        document.getElementById("megaMenu").classList.remove("active");
        document.getElementById("categoryMenuBtn").classList.remove("active");
      }
      if (!event.target.closest(".search-wrap")) {
        document.getElementById("searchSuggestions").classList.remove("active");
      }
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      const query = document.getElementById("searchInput").value;
      const section = document.getElementById("searchCategory").value;
      showSearchResults(query, section);
    });

    document.getElementById("searchInput").addEventListener("input", event => {
      const query = event.target.value.trim();
      const suggestions = document.getElementById("searchSuggestions");

      if (query.length < 2) {
        suggestions.classList.remove("active");
        return;
      }

      const matches = getSearchMatches(query).slice(0, 5);
      suggestions.innerHTML = matches.length
        ? matches.map(product => `
          <button class="suggestion-item" type="button" data-quick="${product.id}">
            <img src="${product.image}" alt="${product.en}">
            <span>${language === "ar" ? product.ar : product.en}</span>
            <b>${formatMoney(product.price)}</b>
          </button>`).join("")
        : `<div class="no-results" style="padding:18px">${language === "ar" ? "لا توجد نتائج" : "No results"}</div>`;

      suggestions.classList.add("active");
    });

    document.querySelectorAll(".carousel-btn").forEach(button => {
      button.addEventListener("click", () => {
        const track = document.getElementById(button.dataset.carousel);
        const amount = Math.max(250, track.clientWidth * .78) * Number(button.dataset.direction);
        track.scrollBy({left: amount, behavior: "smooth"});
      });
    });

    document.getElementById("heroPrev").addEventListener("click", () => {
      showSlide(currentSlide - 1);
      restartSlider();
    });

    document.getElementById("heroNext").addEventListener("click", () => {
      showSlide(currentSlide + 1);
      restartSlider();
    });

    document.querySelectorAll(".hero-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        showSlide(Number(dot.dataset.slide));
        restartSlider();
      });
    });

    document.getElementById("modalLayer").addEventListener("click", event => {
      if (event.target === document.getElementById("modalLayer")) closeModal();
    });

    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("accountBtn").addEventListener("click", openLogin);
    document.getElementById("wishlistBtn").addEventListener("click", showWishlist);
    document.getElementById("trackOrderBtn").addEventListener("click", openTrackOrder);
    document.getElementById("footerTrackBtn").addEventListener("click", openTrackOrder);
    document.getElementById("checkoutBtn").addEventListener("click", openCheckout);
    document.getElementById("quoteBtn").addEventListener("click", openQuoteForm);

    document.getElementById("newsletterForm").addEventListener("submit", event => {
      event.preventDefault();
      const email = event.currentTarget.querySelector("input").value.trim();
      if (!email || !email.includes("@")) {
        showToast(language === "ar" ? "يرجى إدخال بريد إلكتروني صحيح" : "Please enter a valid email", true);
        return;
      }
      event.currentTarget.reset();
      showToast(language === "ar" ? "تم الاشتراك في النشرة البريدية" : "Successfully subscribed");
    });

    document.querySelectorAll(".mobile-links a").forEach(link => {
      link.addEventListener("click", closeMobileDrawer);
    });

    document.getElementById("backTop").addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
    window.addEventListener("scroll", () => {
      document.getElementById("backTop").classList.toggle("show", window.scrollY > 700);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
        closeCart();
        closeMobileDrawer();
      }
    });

    renderProducts();
    applyLanguage();
    updateCounts();
    renderCart();
    showSlide(0);
    restartSlider();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
